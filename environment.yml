name: grade-profile-ml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas=2.2.*
  - numpy=1.26.*
  - openpyxl=3.1.*
  - scikit-learn=1.4.*
  - matplotlib=3.8.*
  - seaborn=0.13.*
  - statsmodels=0.14.*
  - jupyter
  - jupyterlab
  - nbconvert
  - pip
  - pip:
      - prophet==1.1.5
      - ruff==0.4.*
      - pytest==8.2.*
      - nbstripout==0.7.*